name: LPV ChatGPT conversion integration
on:
  push:
    branches: [codex/chatgpt-conversions-20261117]
    paths:
      - wordpress/lpv-chatgpt-conversions/**
      - .github/workflows/lpv-chatgpt-conversions.yml
  pull_request:
    paths:
      - wordpress/lpv-chatgpt-conversions/**
      - .github/workflows/lpv-chatgpt-conversions.yml
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PHP syntax
        run: find wordpress/lpv-chatgpt-conversions -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Confirmed submissions, consent, idempotency, retries and data minimization
        run: |
          php wordpress/lpv-chatgpt-conversions/tests/core-test.php
          php wordpress/lpv-chatgpt-conversions/tests/adapter-test.php
          php wordpress/lpv-chatgpt-conversions/tests/secrets-test.php
      - name: Browser helper checks
        run: node --test wordpress/lpv-chatgpt-conversions/tests/browser-test.cjs
      - name: Prepare installable plugin folder
        run: |
          mkdir -p package/lpv-chatgpt-conversions
          cp wordpress/lpv-chatgpt-conversions/lpv-chatgpt-conversions.php package/lpv-chatgpt-conversions/
          cp wordpress/lpv-chatgpt-conversions/README.md package/lpv-chatgpt-conversions/
          cp -R wordpress/lpv-chatgpt-conversions/includes package/lpv-chatgpt-conversions/
          cp -R wordpress/lpv-chatgpt-conversions/assets package/lpv-chatgpt-conversions/
          test -f package/lpv-chatgpt-conversions/includes/secrets.php
          test ! -d package/lpv-chatgpt-conversions/tests
      - name: Upload WordPress-installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: lpv-chatgpt-conversions-0.2.0
          path: package/
          retention-days: 30
          if-no-files-found: error
